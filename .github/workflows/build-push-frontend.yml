name: Build and Push CVAT Frontend Fixed

on:
  push:
    branches: [ main, feature/audio-playback ]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to Azure Container Registry
        uses: docker/login-action@v2
        with:
          registry: sooryacvatreg.azurecr.io
          username: sooryacvatreg
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push fixed frontend image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: Dockerfile.frontend-fixed
          push: true
          tags: sooryacvatreg.azurecr.io/cvat-ui-fixed:latest
